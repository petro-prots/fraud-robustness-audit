[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudaudit"
version = "0.1.0"
description = "Episode-level adversarial robustness audit of a fraud-detection model as a DevSecOps gate"
requires-python = ">=3.12"

[project.scripts]
fraudaudit = "fraudaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
