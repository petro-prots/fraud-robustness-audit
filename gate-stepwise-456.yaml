target_fpr: 0.01          # per-operation FPR at which the model's τ was chosen (checked against models/model.json)
recall_clean_min: 0.5     # recall on clean test operations at τ
delta: 0.10   # approved by the author 2026-11-15 after calibration (resolution 4.1 pp on 218 episodes); fixed before hardening
attacks: [stepwise]  # fresh held-out stepwise seeds 4-6 (Task 23 onwards); everything else equals gate.yaml, which stays the gate of record
attack_seeds: [4, 5, 6]
confidence: 0.95          # level of all intervals
one_sided: true           # uplift: one-sided upper bound (only uplift ≤ δ is tested); VER intervals stay two-sided
spares_period: fit        # recon spares = fit-period fraud episodes; targets = every test episode (R14); test = old 50/50 split
