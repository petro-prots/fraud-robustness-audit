target_fpr: 0.01          # FPR на операцію, під який обрано τ моделі (звіряється з models/model.json)
recall_clean_min: 0.5     # recall на чистих операціях test при τ
delta: 0.05               # допустимий приріст VER_adv − VER_clean (частка A); затверджено автором 2026-11-15
attacks: [random, es]     # ансамбль атак: вердикт – найгірший прогін
attack_seeds: [1, 2, 3]   # кожна атака з кожним seed на тому самому розподілі карток
confidence: 0.95          # рівень усіх інтервалів
