rho: 0.8
k_max: 20
amount_min: 1.00
amount_max: 1376.04
window_days: 7
max_declines: 1
knowledge: decision        # decision | score (strong – out of scope of this plan)
recon_budget_ops: 2000     # operations on spare cards
cards_per_eval: 5          # spare cards per strategy evaluation
merchant_coord_radius: 1.0 # as in the Sparkov generator: ±1° from home
min_gap_secs: 60          # minimum gap between operations of an episode, s
attack:
  es:                      # (mu+lambda) evolution strategy
    mu: 5                  # parents in the population
    lam: 10                # children per generation
    sigma: 0.15            # mutation std, share of the field's range
    p_merchant: 0.1        # probability of replacing the merchant with a random one
    p_k: 0.2               # probability of k ± 1
tau_after_decline: null    # card-level threshold after the first decline (< model tau); null = no escalation
corridor: null             # soft per-card spending corridor (Task 22); null = off. See realistic-corridor.yaml
