# Базова лінія «звичайного аудиту»: кожна реальна шахрайська операція цільового епізоду атакується окремо,
# зі станом картки з оригінального потоку (агрегати не перераховуються), без реакції банку.
amount_min: 1.00
amount_max: 1376.04
max_shift_days: 7          # зсув часу операції ∈ [0, 7 днів) від її оригінального часу
merchant_coord_radius: 1.0 # як у генераторі Sparkov: ±1° від дому
knowledge: decision        # лише рішення моделі («так/ні»), без p
single_tx_budget: 50       # запитів до моделі на одну операцію (випадковий пошук)
