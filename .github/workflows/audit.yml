name: Robustness audit

on:
  pull_request:
    paths:
      - models/**
      - threat-models/**
      - gate.yaml
      - src/**
      - tests/**
      - scripts/**
      - requirements.txt
      - Dockerfile
      - .github/workflows/audit.yml

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: fraudaudit:runtime
      # the PR head, not the synthetic merge commit (github.sha): reports record the code under audit
      GIT_SHA: ${{ github.event.pull_request.head.sha }}
      GIT_DIRTY: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # pull_request caches are scoped per PR (a new PR downloads once); accepted, no extra triggers
      - name: Restore Sparkov data cache
        id: cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: data
          # the SHA-256 hashes of both files live in the script, so a new dataset version changes the key
          key: sparkov-${{ hashFiles('scripts/download_data.sh') }}

      - name: Download data (SHA-256 verified)
        run: scripts/download_data.sh

      # right after the verified download, so a red gate later still saves the cache; never saves a failed download
      - name: Save Sparkov data cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: data
          key: sparkov-${{ hashFiles('scripts/download_data.sh') }}

      - name: Build image (runtime stage)
        run: docker build --target runtime -t "$IMAGE" .

      - name: Tests
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/app -w /app --entrypoint pytest "$IMAGE" -q

      - name: Skew check
        run: |
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/app -w /app \
            -e GITHUB_STEP_SUMMARY=/app/out/step-summary-skew.md -e GIT_SHA -e GIT_DIRTY \
            "$IMAGE" skew --data data --model models --cards 50 --n-jobs "$(nproc)" --out out/skew.json

      - name: Robustness audit (gate)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/app -w /app \
            -e GITHUB_STEP_SUMMARY=/app/out/step-summary-audit.md -e GIT_SHA -e GIT_DIRTY \
            "$IMAGE" audit --data data --model models --threat threat-models/realistic.yaml --gate gate.yaml \
            --skew-report out/skew.json --out out/ --seed 42 --n-jobs "$(nproc)"

      - name: Job summary
        if: always()
        run: |
          for f in out/step-summary-skew.md out/step-summary-audit.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: audit-out
          path: out/
          if-no-files-found: warn
